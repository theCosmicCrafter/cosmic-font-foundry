name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      IS_TAG: ${{ github.ref_type == 'tag' }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version and tag
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $tauri) { throw "package.json $pkg != tauri.conf.json $tauri" }
          if ($env:IS_TAG -eq "true") {
            if ("v$pkg" -ne $env:TAG) { throw "tag $env:TAG != version $pkg" }
          }
          "VERSION=$pkg" >> $env:GITHUB_ENV

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install npm dependencies
        run: npm ci

      - name: Run core & Windows unit tests
        run: |
          cargo test --manifest-path src-tauri/core/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer (signed if updater key is configured)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npm run installer -- --ci --config src-tauri/tauri.release.conf.json
            "SIGNED=1" >> $env:GITHUB_ENV
          } elseif ($env:IS_TAG -eq "true") {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets"
          } else {
            Write-Warning "No signing key configured: building unsigned test artifacts"
            npm run installer -- --ci
            "SIGNED=0" >> $env:GITHUB_ENV
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package portable zip, latest.json, and SHA-256
        shell: pwsh
        run: |
          $v = $env:VERSION
          $setupName = "Cosmic Font Foundry_${v}_x64-setup.exe"
          $setup = Get-Item "src-tauri/target/release/bundle/nsis/$setupName"
          $outSetup = "Cosmic-Font-Foundry_${v}_x64-setup.exe"

          $dir = New-Item -ItemType Directory -Force "out/portable/Cosmic Font Foundry"
          Copy-Item "src-tauri/target/release/cosmic-font-foundry.exe" "$dir/Cosmic Font Foundry.exe"
          Copy-Item LICENSE "$dir/LICENSE.txt"
          Copy-Item THIRD-PARTY-NOTICES.md $dir
          Copy-Item licenses "$dir/licenses" -Recurse
          Compress-Archive "$dir/*" "out/Cosmic-Font-Foundry_${v}_x64-portable.zip"
          Copy-Item $setup "out/$outSetup"

          if ($env:SIGNED -eq "1") {
            $sig = (Get-Content "$($setup.FullName).sig" -Raw).Trim()
            Copy-Item "$($setup.FullName).sig" "out/${outSetup}.sig"
            $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$v/$outSetup"
            $platform = @{ signature = $sig; url = $url }
            $json = [ordered]@{
              version   = $v
              notes     = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$v"
              pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = [ordered]@{ "windows-x86_64" = $platform; "windows-x86_64-nsis" = $platform }
            } | ConvertTo-Json -Depth 5
            [IO.File]::WriteAllText("$PWD/out/latest.json", $json)
          }

          Push-Location out
          $sums = Get-ChildItem -File | Where-Object { $_.Extension -in ".exe", ".zip" } | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $sums | Set-Content SHA256SUMS.txt -Encoding ascii
          Pop-Location
          Get-Content out/SHA256SUMS.txt

      - name: Upload workflow artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cosmic-font-foundry-${{ env.VERSION }}-${{ github.sha }}
          path: out/*.*
          if-no-files-found: error

      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $notesFile = ".github/notas/$env:TAG.md"
          $body = if (Test-Path $notesFile) { (Get-Content $notesFile -Raw).TrimEnd() } else { "Release $env:TAG" }
          $fence = [string][char]96 * 3
          $body += "`n`n### SHA-256`n$fence`n" + ((Get-Content out/SHA256SUMS.txt) -join "`n") + "`n$fence`n"
          $body | Set-Content notes.md -Encoding utf8
          $files = @(Get-ChildItem out -File | ForEach-Object FullName)
          gh release create $env:TAG --draft --verify-tag --title "Cosmic Font Foundry $env:TAG" --notes-file notes.md @files
