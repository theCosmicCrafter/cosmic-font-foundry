# On release publish (non-draft): submits the updated version to winget-pkgs via komac.
# First version is submitted manually (see winget/README.md).
# Requires WINGET_TOKEN secret (classic token with public_repo scope on a winget-pkgs fork).
name: winget

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag (vX.Y.Z)"
        required: true

permissions:
  contents: read

jobs:
  winget:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      KOMAC: "2.17.2"
      KOMAC_SHA256: "38a5a53b2291e959157a46a9ed2f20c1c66e9e238666780519650fcc8d37ad58"
    steps:
      - name: Submit to winget
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Warning "Missing WINGET_TOKEN secret: skipping winget submission"; exit 0 }
          $v = $env:TAG.TrimStart("v")
          $exe = "komac.exe"
          Invoke-WebRequest "https://github.com/russellbanks/Komac/releases/download/v$env:KOMAC/komac-$env:KOMAC-x86_64-pc-windows-msvc.exe" -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() -ne $env:KOMAC_SHA256) { throw "komac SHA-256 mismatch" }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$v/Cosmic-Font-Foundry_${v}_x64-setup.exe"
          ./komac.exe update TheCosmicCrafter.CosmicFontFoundry --version $v --urls $url --release-notes-url "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$v" --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
