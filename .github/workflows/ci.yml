name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  reuse:
    name: SPDX License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: SPDX License Compliance (REUSE)
        uses: fsfe/reuse-action@v5

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run vite:build
      - run: cargo fmt --manifest-path src-tauri/core/Cargo.toml -- --check
      - run: cargo fmt --manifest-path src-tauri/foundry/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/core/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path src-tauri/foundry/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/core/Cargo.toml
      - run: cargo test --manifest-path src-tauri/foundry/Cargo.toml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run vite:build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo fmt --manifest-path src-tauri/foundry/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path src-tauri/foundry/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/core/Cargo.toml
      - run: cargo test --manifest-path src-tauri/foundry/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
