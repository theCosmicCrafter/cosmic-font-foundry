<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-base" x1="40" y1="30" x2="472" y2="482" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E133D" />
      <stop offset="55%" stop-color="#160D2B" />
      <stop offset="100%" stop-color="#0D0819" />
    </linearGradient>
    <radialGradient id="nebula-warm" cx="0.82" cy="0.18" r="0.68">
      <stop offset="0%" stop-color="#FF8A3D" stop-opacity="0.62" />
      <stop offset="45%" stop-color="#D9468F" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#160D2B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-cool" cx="0.18" cy="0.82" r="0.65">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0D0819" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="f-grad" x1="175" y1="120" x2="310" y2="395" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="38%" stop-color="#FF7B47" />
      <stop offset="100%" stop-color="#E14796" />
    </linearGradient>
    <linearGradient id="orbit-grad" x1="80" y1="310" x2="430" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="52%" stop-color="#F43F8E" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <radialGradient id="orb-grad" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#FFF7D6" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </radialGradient>
    <clipPath id="squircle">
      <rect x="24" y="24" width="464" height="464" rx="108" />
    </clipPath>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Nebula squircle base -->
    <rect x="24" y="24" width="464" height="464" fill="url(#bg-base)" />
    <rect x="24" y="24" width="464" height="464" fill="url(#nebula-warm)" />
    <rect x="24" y="24" width="464" height="464" fill="url(#nebula-cool)" />

    <!-- Subtle typographic guide lines -->
    <g stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5" stroke-dasharray="5 6">
      <line x1="48" y1="138" x2="464" y2="138" />
      <line x1="48" y1="378" x2="464" y2="378" />
      <line x1="176" y1="48" x2="176" y2="464" />
    </g>

    <!-- Starfield -->
    <g fill="#FFFFFF">
      <circle cx="96" cy="96" r="2" opacity="0.7" />
      <circle cx="145" cy="72" r="1.4" opacity="0.45" />
      <circle cx="395" cy="86" r="1.8" opacity="0.55" />
      <circle cx="422" cy="148" r="1.3" opacity="0.4" />
      <circle cx="88" cy="240" r="1.6" opacity="0.45" />
      <circle cx="118" cy="408" r="1.5" opacity="0.5" />
      <circle cx="315" cy="426" r="1.8" opacity="0.5" />
      <circle cx="426" cy="398" r="1.4" opacity="0.45" />
    </g>

    <!-- Back half of orbital ring -->
    <ellipse
      cx="256"
      cy="262"
      rx="178"
      ry="68"
      transform="rotate(-24 256 262)"
      stroke="url(#orbit-grad)"
      stroke-width="6"
      stroke-opacity="0.55"
    />

    <!-- Bold geometric F with glow -->
    <path
      d="M176 138 H346 V196 H238 V236 H322 V292 H238 V378 H176 Z"
      fill="url(#f-grad)"
      filter="url(#soft-glow)"
    />

    <!-- Front luminous arc of orbital ring -->
    <path
      d="M 104 330 A 178 68 -24 0 0 408 194"
      stroke="url(#orbit-grad)"
      stroke-width="6.5"
      stroke-linecap="round"
      filter="url(#soft-glow)"
    />

    <!-- Golden planet orb on ring -->
    <circle cx="398" cy="198" r="14" fill="url(#orb-grad)" filter="url(#soft-glow)" />

    <!-- Vector Bézier handle & anchor nodes -->
    <g stroke="#FFFFFF" stroke-width="2.2">
      <line x1="176" y1="138" x2="346" y2="138" stroke-opacity="0.45" />
      <line x1="176" y1="138" x2="176" y2="378" stroke-opacity="0.45" />
      <line x1="130" y1="378" x2="176" y2="378" stroke-opacity="0.85" />
      <circle cx="126" cy="378" r="6" fill="#160D2B" />
      <rect x="170" y="132" width="12" height="12" rx="2" fill="#FFFFFF" />
      <rect x="340" y="132" width="12" height="12" rx="2" fill="#FFFFFF" />
      <rect x="170" y="372" width="12" height="12" rx="2" fill="#FFFFFF" />
    </g>

    <!-- 4-point cosmic sparkle -->
    <path
      d="M368 320 L373 336 L389 341 L373 346 L368 362 L363 346 L347 341 L363 336 Z"
      fill="#FFFFFF"
      filter="url(#soft-glow)"
    />
  </g>

  <!-- Subtle squircle inner rim -->
  <rect
    x="25"
    y="25"
    width="462"
    height="462"
    rx="107"
    stroke="#FFFFFF"
    stroke-opacity="0.14"
    stroke-width="2"
  />
</svg>
